name: Bug report
description: Report a reproducible problem in a repository or internal tool.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, access tokens, private keys, customer data, or other sensitive values.
  - type: input
    id: repository
    attributes:
      label: Repository or system
      description: Which repository, application, or system is affected?
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Provide the smallest practical sequence that reproduces the problem.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who or what is affected?
  - type: textarea
    id: evidence
    attributes:
      label: Non-sensitive evidence
      description: Add logs, screenshots, or references only if they contain no sensitive information.
